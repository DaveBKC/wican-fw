name: Build firmware

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build (WiCAN PRO, ESP32-S3)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py build

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p out
          cp build/Wican_*.bin out/
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/ota_data_initial.bin out/
          cp build/flash_args out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: wican-pro-firmware-${{ github.sha }}
          path: out/
