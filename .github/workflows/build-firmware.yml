name: Build firmware

on:
  push:
    branches: ["**", "!firmware-builds/**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build (WiCAN PRO, ESP32-S3)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py build

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p out
          cp build/Wican_*.bin out/
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/ota_data_initial.bin out/
          cp build/flash_args out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: wican-pro-firmware-${{ github.sha }}
          path: out/

      # Also keep the latest binaries on a "firmware-builds/<branch>" branch, so they
      # can be fetched with plain git (artifact downloads need a browser login).
      - name: Publish binaries to firmware-builds branch
        shell: bash
        run: |
          BR="firmware-builds/${GITHUB_REF_NAME}"
          cd out
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}" > BUILD_INFO.txt
          git add -A
          git commit -q -m "Firmware build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BR"
